<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Verwaltung – Balzner BBQ</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">

<div class="demo-banner">
  <span>Demo-Verwaltung: Alle Daten sind Beispiele und nur in diesem Browser gespeichert.</span>
  <button id="zuruecksetzen" type="button">Beispieldaten zurücksetzen</button>
</div>

<!-- Anmeldung (Demo: ohne Passwort) -->
<section class="login" id="login">
  <div class="login-karte">
    <span class="logo">Balzner<span>BBQ</span></span>
    <h2 style="font-size:1.4rem;margin:0 auto 6px">Verwaltung</h2>
    <p>Kurse, Produkte, Bestellungen und Statistik an einem Ort.</p>
    <button class="btn btn-glut btn-voll" id="anmelden" type="button">Demo öffnen</button>
    <small>In der fertigen Version meldet man sich mit eigenem Konto an.</small>
  </div>
</section>

<!-- Verwaltung -->
<div class="layout" id="app" hidden>
  <aside class="seite">
    <span class="logo">Balzner<span>BBQ</span></span>
    <span class="rolle">Verwaltung</span>
    <button class="navpunkt" data-ansicht="uebersicht"><span class="ico">📊</span><span class="txt">Übersicht</span></button>
    <button class="navpunkt" data-ansicht="kurse"><span class="ico">🔥</span><span class="txt">Kurse</span></button>
    <button class="navpunkt" data-ansicht="produkte"><span class="ico">🧂</span><span class="txt">Produkte</span></button>
    <button class="navpunkt" data-ansicht="bestellungen"><span class="ico">📦</span><span class="txt">Bestellungen</span><span class="zahl" id="zahlBestellungen" hidden></span></button>
    <button class="navpunkt" data-ansicht="gutscheine"><span class="ico">🎁</span><span class="txt">Gutscheine</span></button>
    <button class="navpunkt" data-ansicht="anfragen"><span class="ico">✉️</span><span class="txt">Anfragen</span><span class="zahl" id="zahlAnfragen" hidden></span></button>
    <div class="unten">
      <a class="navpunkt" href="index.html" target="_blank" rel="noopener"><span class="ico">↗</span><span class="txt">Zur Webseite</span></a>
      <button class="navpunkt" id="abmelden"><span class="ico">⏻</span><span class="txt">Abmelden</span></button>
    </div>
  </aside>
  <main class="inhalt" id="ansicht"></main>
</div>

<dialog class="dialog" id="dialog">
  <button class="schliessen" data-dialog-zu aria-label="Schliessen">×</button>
  <div id="dialogInhalt"></div>
</dialog>
<div class="tooltip" id="tooltip"></div>
<div class="druckbereich" id="druckbereich"></div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/gutschein-pdf.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
